# DNA on OpenResty: a minimal nginx.conf around the include files.
# Requires OpenResty (or nginx built with ngx_http_lua_module) and lua-resty-http.
# See README.md in this directory; docs: https://ai.d3.com/docs/sdks/nginx

# The environment DNA reads. Main context only: nginx hides every other variable from Lua.
include /etc/nginx/lua/dna.main.conf;

events {}

http {
  # lua-resty-http looks the DNA endpoint up itself; nginx's own wait would be 30 s.
  resolver 1.1.1.1 8.8.8.8 ipv6=off;
  resolver_timeout 2s;

  # TLS verification for the calls to DNA. RHEL: /etc/pki/tls/certs/ca-bundle.crt
  lua_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
  lua_ssl_verify_depth 2;

  server {
    listen 80;
    server_name www.example.com;

    # Every phase DNA needs, inherited by each location below.
    include /etc/nginx/lua/dna.server.conf;

    location / {
      proxy_set_header Host $host;
      proxy_pass http://backend_upstream;
    }
  }
}
