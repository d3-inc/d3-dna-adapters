# DNA for OpenResty: include once in each server block it covers. Every
# location inherits these, unless it sets a *_by_lua handler of its own for
# the same phase (README.md, "Locations with their own Lua"). Kept elsewhere
# than /etc/nginx/lua, change the path below.
access_by_lua_file /etc/nginx/lua/dna_access.lua;
header_filter_by_lua_block { local dna = package.loaded.d3_dna if dna then dna.header_filter() end }
body_filter_by_lua_block { local dna = package.loaded.d3_dna if dna then dna.body_filter() end }
log_by_lua_block { local dna = package.loaded.d3_dna if dna then dna.log() end }
