# DNA for OpenResty: the main context. Include it at the top of nginx.conf,
# outside http {}: nginx hides from Lua every variable not named here.
env DNA_API_KEY;
env DNA_ENABLED;
env DNA_ENDPOINT;
env DNA_FAIL_MODE;
env DNA_TIMEOUT_MS;
env DNA_PAYMENT_TIMEOUT_MS;
env DNA_EXCLUDE_HEADERS;
env DNA_EXCLUDE_COOKIES;
env DNA_DEBUG_LOG_RAW_PAYLOAD;
# Earlier names, still read.
env POLICY_ADAPTER_KEY;
env POLICY_SHARED_SECRET;
env POLICY_WORKER_URL;
env FAIL_MODE;
env POLICY_TIMEOUT_MS;
env POLICY_PAYMENT_TIMEOUT_MS;
env DEBUG_LOG_RAW_PAYLOAD;
