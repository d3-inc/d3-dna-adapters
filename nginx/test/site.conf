# The OpenResty the suite runs: three servers, each an install shape a site has.
# run.sh fills in @HOST@ (where the origin and the mock DNA listen).
include /etc/nginx/lua/dna.main.conf;
worker_processes 1;
error_log /logs/error.log warn;
events {}

http {
  access_log off;
  lua_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
  # Small, so a 64 KB body spills to disk and the script reads it back from there.
  client_body_buffer_size 16k;
  client_max_body_size 4m;

  upstream origin {
    server @HOST@:3010;
  }

  # The include: revision 3.
  server {
    listen 8120;
    underscores_in_headers on;
    include /etc/nginx/lua/dna.server.conf;

    location / {
      proxy_pass http://origin;
    }

    location /own-filter/ {
      header_filter_by_lua_block { ngx.header["x-site-filter"] = "1" }
      proxy_pass http://origin;
    }

    location /own-access/ {
      access_by_lua_block { ngx.req.set_header("x-site-access", "1") }
      proxy_pass http://origin;
    }

    # Upgraded halfway: the old line left in a location of a server with the include.
    location /half/ {
      access_by_lua_file /etc/nginx/lua/web_bot_auth_verify.lua;
      try_files $uri @half;
    }

    location @half {
      proxy_pass http://origin;
    }

    location /mcp-own-body {
      body_filter_by_lua_block { }
      proxy_pass http://origin;
    }
  }

  # The include in front of a framework: try_files hands misses to @app.
  server {
    listen 8121;
    root /etc/nginx/lua/test/www;
    include /etc/nginx/lua/dna.server.conf;

    location / {
      try_files $uri @app;
    }

    location @app {
      proxy_pass http://origin;
    }
  }

  # An install from before the include: one access line, so revision 1.
  server {
    listen 8122;

    location / {
      access_by_lua_file /etc/nginx/lua/web_bot_auth_verify.lua;
      proxy_pass http://origin;
    }
  }
}
