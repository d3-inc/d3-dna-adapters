packages:
  - packages/*

# Native/postinstall deps that are allowed to run build scripts.
onlyBuiltDependencies:
  - esbuild
  - workerd

# Each clears an advisory `pnpm audit` reported. pnpm 11 reads overrides only from this file.
overrides:
  'minimatch@>=10.0.0 <11.0.1': ^11.0.1
  'sharp@<0.35.5': ^0.35.5
  'undici@<7.30.1': ^7.30.1
  'glob@>=9.0.0 <=14.0.1': ^14.0.2
  'zod@>=4.0.0 <4.6.6': ^4.6.7
