server {
    listen 80;
    root /var/www/html;
    index index.php;
    client_max_body_size 8m;

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # Looked up per request: run.sh recreates the FPM container, which may come back at another address.
    resolver 127.0.0.11 valid=1s;
    set $fpm fpm:9000;

    location ~ \.php$ {
        fastcgi_pass $fpm;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}
