# D3 Edge enforcement worker. Deployed unrouted; attach your hostname in the
# Cloudflare dashboard afterwards (Settings → Domains & Routes → add route).
name = "d3-edge-devnet"
main = "src/index.ts"
compatibility_date = "2025-06-01"

# No workers.dev URL: unrouted, this worker would proxy any request it is sent.
# It only ever runs attached to your hostname.
workers_dev = false

[vars]
# D3's internal devnet: without this line the worker calls production.
DNA_ENDPOINT = "https://edge-api-dev.d3.com/v1/decision"
DNA_TIMEOUT_MS = "500"
DNA_FAIL_MODE = "open"
# Off switch. Set it here, not in the Cloudflare dashboard: the next deploy
# replaces dashboard vars with this file's.
# DNA_ENABLED = "false"
